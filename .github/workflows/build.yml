# Builds Stratum on Java 25 for every pull request and every push to main.
# One run does three things: ./mvnw verify (every build check and test), an SBOM (a CycloneDX list
# of every library the build includes) and an OSV-Scanner check of that SBOM for known
# vulnerabilities. The security profile's NVD scan is not run here, because its NVD download made
# runs take from 24 minutes to over an hour; OSV-Scanner queries only the libraries in the SBOM.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a pull request replaces its running build; builds of main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Verify and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # The SBOM plugin version comes from Spring Boot's parent, so this file sets no plugin version.
      - name: Read the SBOM plugin version
        id: sbom-plugin
        run: |
          version=$(./mvnw -B -q -pl platform/stratum-parent help:evaluate \
            -Dexpression=cyclonedx-maven-plugin.version -DforceStdout)
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Could not read cyclonedx-maven-plugin.version from stratum-parent: '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test and write the SBOM
        env:
          CYCLONEDX_VERSION: ${{ steps.sbom-plugin.outputs.version }}
        run: >-
          ./mvnw -B --no-transfer-progress verify
          "org.cyclonedx:cyclonedx-maven-plugin:${CYCLONEDX_VERSION}:makeAggregateBom"

      - name: Upload the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            target/bom.json
            target/bom.xml
          if-no-files-found: error

      # Runs after the upload, so the SBOM is kept when this step finds a vulnerability.
      - name: Scan the SBOM for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=target/bom.json

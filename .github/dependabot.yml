# Opens pull requests that upgrade Stratum's Maven dependencies and plugins and its GitHub Actions.
# Every such pull request runs the full build in build.yml, and the owner merges it; nothing merges
# automatically. The reasons and the review steps are in docs/adr/0004-dependency-updates.md.
# Every Maven version Stratum sets is in the root pom.xml (docs/adr/0005-versions-in-the-root-pom.md).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Offers a release only once it is 7 days old. Security updates do not wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # The Spring Boot parent of the root pom.xml and any other Spring library, upgraded together in
      # one pull request.
      spring:
        patterns:
          - "org.springframework*"
      maven:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"

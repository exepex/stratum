stratum:
  web:
    error:
      statuses:
        ORD-0001: 409
        ORD-0002: 503
    correlation:
      accept-from-caller: false
    client-ip:
      trusted-proxies:
        - 10.20.0.0/16
    user-agent:
      parse: true
      cache-size: 500
      request-client-hints: true
    request-fields:
      max-value-length: 256
    request-log:
      request-headers:
        "[X-Tenant-Id]": tenantId
      token-payload: true
      token-claims:
        - sub
        - tenant
    timeout:
      default-limit: 5s
      routes:
        "[/reports/**]": 60s
      status: 504

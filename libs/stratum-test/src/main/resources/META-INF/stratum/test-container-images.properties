# The name and tag of each test container's Docker image, filled in by the build from the root
# pom.xml, which also combines them into the full image, so every name and tag is written in one
# place (ST-ENG-60, ADR 0005). ContainerImages reads them.
postgres.name=@testcontainers.image.postgres.name@
postgres.tag=@testcontainers.image.postgres.tag@
postgres.image=@testcontainers.image.postgres.name@:@testcontainers.image.postgres.tag@
redis.name=@testcontainers.image.redis.name@
redis.tag=@testcontainers.image.redis.tag@
redis.image=@testcontainers.image.redis.name@:@testcontainers.image.redis.tag@

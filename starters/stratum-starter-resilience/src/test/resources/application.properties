# The single starters of the microservice bundle are on the test classpath. The logging starter is off
# by default, so log lines stay plain; NoRouteIntegrationTest turns it on.
stratum.logging.enabled=false
spring.application.name=resilience-tests
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false

stratum:
  cache:
    max-caches: 7
    warning-interval: 5m
    redis-retry-interval: 2s
    max-value-size: 2MB
    caches:
      reports:
        max-value-size: 5MB
        time-to-live: 1h
        command-timeout: 3s
    serialization:
      allowed-packages:
        - com.acme.shared
        - com.acme.billing

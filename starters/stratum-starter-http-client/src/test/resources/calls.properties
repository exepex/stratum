# The clients of the call log and meter tests (CallsTestData).
stratum.http-client.defaults.retry.max-retries=3
stratum.http-client.defaults.retry.delay=10ms
stratum.http-client.defaults.retry.backoff-policy=fixed
stratum.http-client.clients.audited.call-log=all
stratum.http-client.clients.silent.call-log=none
stratum.http-client.clients.silent.shared-pool=true
stratum.http-client.clients.fragile.circuit-breaker.minimum-number-of-calls=2
stratum.http-client.clients.fragile.circuit-breaker.sliding-window-size=2
stratum.http-client.clients.fragile.circuit-breaker.failure-rate-threshold=50
stratum.http-client.clients.held.max-connections=1
stratum.http-client.clients.held.max-wait=50ms
stratum.http-client.clients.held.timeout=300ms
stratum.http-client.clients.held.retry.max-retries=0

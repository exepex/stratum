# The reports client of the operation timeout tests (TimedTestData): no retries, short timeouts of
# its own, and each operation's own.
stratum.http-client.clients.reports.retry.max-retries=0
stratum.http-client.clients.reports.read-timeout=300ms
stratum.http-client.clients.reports.total-timeout=600ms
stratum.http-client.clients.reports.operations.monthly-report.read-timeout=3s
stratum.http-client.clients.reports.operations.monthly-report.total-timeout=4s
stratum.http-client.clients.reports.operations.quick-check.read-timeout=100ms
stratum.http-client.clients.reports.operations.export.read-timeout=3s
